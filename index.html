<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Sales Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-dark:#0F4C4B;
    --teal-deep:#0B3A39;
    --marigold:#F4A93B;
    --coral:#E4572E;
    --cream:#FBF7F0;
    --charcoal:#22292B;
    --green:#3E8E5A;
    --card-radius:14px;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--charcoal);
  }

  header{
    background:linear-gradient(120deg,var(--teal-dark),var(--teal-deep));
    color:white;
    padding:28px 32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }

  header h1{
    font-family:'Sora',sans-serif;
    font-size:1.6rem;
    margin:0;
    letter-spacing:0.3px;
  }

  header p{
    margin:4px 0 0;
    font-size:0.85rem;
    opacity:0.75;
  }

  #status{
    padding:6px 14px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:600;
    background:var(--green);
    color:white;
  }
  #status.offline{
    background:var(--coral);
  }

  main{
    max-width:1100px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  .top-grid{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:20px;
    margin-bottom:24px;
  }

  @media (max-width:800px){
    .top-grid{grid-template-columns:1fr;}
  }

  .card{
    background:white;
    border-radius:var(--card-radius);
    padding:22px;
    box-shadow:0 2px 10px rgba(15,76,75,0.08);
  }

  .card h2{
    font-family:'Sora',sans-serif;
    font-size:1.05rem;
    margin:0 0 16px;
    color:var(--teal-dark);
  }

  label{
    display:block;
    font-size:0.8rem;
    font-weight:600;
    margin:12px 0 6px;
    color:#5b6668;
  }

  input{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #E4DFD3;
    border-radius:8px;
    font-size:0.95rem;
    font-family:'Inter',sans-serif;
  }
  input:focus{
    outline:none;
    border-color:var(--marigold);
  }

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:transform 0.1s ease;
  }
  button:active{transform:scale(0.97);}

  .btn-primary{
    margin-top:18px;
    width:100%;
    padding:12px;
    background:var(--coral);
    color:white;
    font-size:0.95rem;
  }
  .btn-primary:hover{background:#cf4a24;}

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }

  .stat{
    background:var(--teal-dark);
    color:white;
    border-radius:10px;
    padding:16px;
    position:relative;
    overflow:hidden;
  }
  .stat.marigold{background:var(--marigold); color:var(--teal-deep);}
  .stat.coral{background:var(--coral);}
  .stat.charcoal{background:var(--charcoal);}

  .stat .label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.6px;
    opacity:0.85;
    font-weight:600;
  }
  .stat .value{
    font-family:'Sora',sans-serif;
    font-size:1.5rem;
    margin-top:6px;
    font-weight:700;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:0.9rem;
  }
  th{
    text-align:left;
    padding:10px 8px;
    color:#5b6668;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
    border-bottom:2px solid #E4DFD3;
  }
  td{
    padding:10px 8px;
    border-bottom:1px solid #F0ECE2;
  }
  tr:hover td{background:#FBF3E6;}

  .empty-row td{
    text-align:center;
    color:#9aa0a1;
    padding:24px;
    font-style:italic;
  }

  .actions{
    display:flex;
    gap:12px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  .btn-secondary{
    padding:10px 18px;
    background:var(--teal-dark);
    color:white;
    font-size:0.85rem;
  }
  .btn-secondary:hover{background:var(--teal-deep);}
  .btn-danger{
    padding:10px 18px;
    background:white;
    color:var(--coral);
    border:1.5px solid var(--coral) !important;
    font-size:0.85rem;
  }
  .btn-danger:hover{background:#fdf0ec;}

  .badge-best{
    display:inline-block;
    margin-top:4px;
    background:var(--marigold);
    color:var(--teal-deep);
    padding:2px 10px;
    border-radius:999px;
    font-size:0.7rem;
    font-weight:700;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🛍️ Daily Sales Dashboard</h1>
    <p>Record sales, watch your totals update instantly</p>
  </div>
  <span id="status">● Connecting...</span>
</header>

<main>

  <div class="top-grid">

    <div class="card">
      <h2>Record a Sale</h2>
      <form id="saleForm">
        <label for="item">Item name</label>
        <input type="text" id="item" required placeholder="e.g. Rice (5kg bag)">

        <label for="price">Unit price (GH₵)</label>
        <input type="number" id="price" step="0.01" min="0" required placeholder="e.g. 45.00">

        <label for="quantity">Quantity sold</label>
        <input type="number" id="quantity" min="1" required placeholder="e.g. 2">

        <button type="submit" class="btn-primary">Add Sale</button>
      </form>
    </div>

    <div class="card">
      <h2>Today's Summary</h2>
      <div class="stat-grid">
        <div class="stat">
          <div class="label">Total Sales</div>
          <div class="value" id="totalSales">GH₵ 0.00</div>
        </div>
        <div class="stat marigold">
          <div class="label">Transactions</div>
          <div class="value" id="numTransactions">0</div>
        </div>
        <div class="stat coral">
          <div class="label">Units Sold</div>
          <div class="value" id="totalUnits">0</div>
        </div>
        <div class="stat charcoal">
          <div class="label">Best Seller</div>
          <div class="value" id="bestItem" style="font-size:1.1rem;">—</div>
        </div>
      </div>
    </div>

  </div>

  <div class="card">
    <h2>Transactions</h2>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Item</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="transactionBody">
        <tr class="empty-row"><td colspan="5">No sales recorded yet today</td></tr>
      </tbody>
    </table>

    <div class="actions">
      <button class="btn-secondary" onclick="downloadReport()">⬇ Download Report</button>
      <button class="btn-danger" onclick="resetSales()">↺ Reset Today's Sales</button>
    </div>
  </div>

</main>

<script>
const statusEl = document.getElementById('status');

function setOnline(isOnline){
  if(isOnline){
    statusEl.textContent = '● Connected';
    statusEl.classList.remove('offline');
  } else {
    statusEl.textContent = '● Server not reachable';
    statusEl.classList.add('offline');
  }
}

async function refreshSummary(){
  try{
    const res = await fetch('/api/summary');
    const data = await res.json();
    document.getElementById('totalSales').textContent = 'GH₵ ' + data.total_sales.toFixed(2);
    document.getElementById('numTransactions').textContent = data.num_transactions;
    document.getElementById('totalUnits').textContent = data.total_units;
    document.getElementById('bestItem').textContent = data.best_item ? data.best_item : '—';
    setOnline(true);
  }catch(err){
    setOnline(false);
  }
}

async function refreshTransactions(){
  try{
    const res = await fetch('/api/transactions');
    const data = await res.json();
    const body = document.getElementById('transactionBody');

    if(data.length === 0){
      body.innerHTML = '<tr class="empty-row"><td colspan="5">No sales recorded yet today</td></tr>';
      return;
    }

    body.innerHTML = data.map(s => `
      <tr>
        <td>${s.time}</td>
        <td>${s.item}</td>
        <td>GH₵ ${s.price.toFixed(2)}</td>
        <td>${s.quantity}</td>
        <td>GH₵ ${s.total.toFixed(2)}</td>
      </tr>
    `).reverse().join('');
    setOnline(true);
  }catch(err){
    setOnline(false);
  }
}

document.getElementById('saleForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const item = document.getElementById('item').value;
  const price = document.getElementById('price').value;
  const quantity = document.getElementById('quantity').value;

  try{
    await fetch('/api/sale', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({item, price, quantity})
    });

    document.getElementById('saleForm').reset();
    refreshSummary();
    refreshTransactions();
  }catch(err){
    setOnline(false);
  }
});

function downloadReport(){
  window.open('/api/report', '_blank');
}

async function resetSales(){
  const confirmed = confirm('Are you sure you want to reset all of today\'s transactions? This cannot be undone.');
  if(!confirmed) return;

  try{
    await fetch('/api/reset', {method: 'POST'});
    refreshSummary();
    refreshTransactions();
  }catch(err){
    setOnline(false);
  }
}

// Initial load + refresh every 5 seconds in case of multiple users
refreshSummary();
refreshTransactions();
setInterval(() => { refreshSummary(); refreshTransactions(); }, 5000);
</script>

</body>
</html>
